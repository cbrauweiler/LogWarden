# LogWarden web frontend.
#
# Only public/ is served; src/, config/ and var/ must never be reachable over
# HTTP. Keeping the document root at public/ is what guarantees that.

server {
    listen 443 ssl http2;
    server_name logwarden.example.local;

    ssl_certificate     /etc/ssl/certs/logwarden.crt;
    ssl_certificate_key /etc/ssl/private/logwarden.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /opt/logwarden/public;
    index index.php;

    client_max_body_size 4m;   # logo uploads

    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "DENY"             always;
    add_header Referrer-Policy           "same-origin"      always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        include              fastcgi_params;
        fastcgi_pass         unix:/run/php/php8.4-fpm-logwarden.sock;
        fastcgi_param        SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    # Static assets are content-hashed by the application's ?v= parameter.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 80;
    server_name logwarden.example.local;
    return 301 https://$host$request_uri;
}
